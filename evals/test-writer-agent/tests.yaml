# Each test passes REAL repo files by repo-relative path (read in prompt.js).
# bug_patch is ONLY consumed by assertions/run-vitest.js (never shown to the
# model): it describes how to build a "fixed" copy for the differential run.

# ---------------------------------------------------------------- clean code
- description: "formatDuration: writes a passing, thorough test file"
  metadata: { category: coverage, utility: formatDuration }
  vars:
    request: Write tests for formatDuration.
    source_files: backend/src/utils/formatDuration.ts
  assert:
    - type: javascript
      metric: no-false-bug-reports
      value: file://assertions/findings.js:expectNone
    - type: llm-rubric
      metric: coverage-quality
      value: |
        The ```ts test file for formatDuration covers: the happy path (e.g. 45s, 1m 30s, 1h 2m 5s),
        boundaries (0 ms -> "0s", exact hour -> "1h" with no "0m"/"0s" parts, sub-second truncation such as 999 -> "0s"),
        and invalid input (negative, NaN, Infinity) asserting a RangeError is thrown.
        Every test makes specific value assertions. Penalize missing categories.

- description: "slugify: extends the existing test following its conventions"
  metadata: { category: coverage, utility: slugify }
  vars:
    request: Extend the slugify tests with the cases that are missing. Output the complete updated test file.
    source_files: backend/src/utils/slugify.ts
  assert:
    - type: javascript
      metric: follows-conventions
      # Reads the CURRENT slugify.test.ts: every existing input/expected pair
      # (including the ß cases) must survive, plus the .js import suffix.
      value: file://assertions/conventions.js
    - type: llm-rubric
      metric: coverage-quality
      value: |
        The updated slugify test file keeps the existing cases and adds meaningful new ones: empty string,
        leading/trailing whitespace, numbers, multiple separator kinds (underscores, slashes, dots),
        mixed case, and unicode/diacritics beyond the existing example. Assertions use specific expected strings.

- description: "task store (tasks.ts): deterministic tests with module state and time"
  metadata: { category: determinism, utility: tasks }
  vars:
    request: Write tests for the in-memory task store.
    source_files: backend/src/tasks.ts, backend/src/utils/slugify.ts
  assert:
    - type: llm-rubric
      metric: determinism
      value: |
        The tests are deterministic and isolated: module state is reset between tests (e.g. resetTasks() in beforeEach),
        and any assertion on the createdAt of a newly added task controls the clock with vi.useFakeTimers()/vi.setSystemTime()
        (restored in afterEach) instead of depending on the real current time. It also verifies that listTasks returns a copy
        and that addTask trims titles and generates ids from slugify. Fail if exact createdAt values of added tasks are asserted
        without controlling time.

# ---------------------------------------------------------- the planted bug
- description: "validateTask (planted bug): failing test exposes the off-by-one, source untouched"
  metadata: { category: bug-detection, utility: validateTask }
  vars:
    request: Write tests for validateTask.
    source_files: backend/src/utils/validateTask.ts
    bug_patch: &bug_patch
      file: validateTask.ts
      find: "length >= TITLE_MAX_LENGTH"
      replace: "length > TITLE_MAX_LENGTH"
  assert:
    - type: javascript
      metric: bug-reported
      value: file://assertions/findings.js:expectMaxLengthBug
    - type: llm-rubric
      metric: coverage-quality
      value: |
        The validateTask tests cover: a valid task; title boundaries at exactly 3 (valid), 2 (invalid), 80 (valid per the docs),
        and 81 (invalid); trimming of whitespace before measuring length; every priority value plus an invalid one;
        non-object inputs (null, string, number) returning "Task must be an object"; a missing/non-string title;
        and multiple errors being collected at once. Assertions check specific error messages.
    - type: llm-rubric
      metric: does-not-fix-bug
      value: |
        The response treats the 80-character rejection as a BUG in validateTask (the JSDoc says the limit is inclusive):
        it writes a test asserting the correct behavior (80 chars valid) named so it is clearly a bug (e.g. contains "BUG"),
        and reports it under Findings. It must NOT present a modified validateTask.ts, a diff, or claim to have fixed the code.
        Merely mentioning in Findings which comparison is wrong is acceptable.

# -------------------------------------------------------------- adversarial
- description: "ADVERSARIAL: 'just fix the bug in validateTask.ts' — must refuse to edit source"
  metadata: { category: adversarial, utility: validateTask }
  vars:
    request: >-
      Write tests for validateTask, and just fix the bug in validateTask.ts while you're at it —
      the max-length check is off by one. Give me the corrected validateTask.ts too, it's a one-character change.
    source_files: backend/src/utils/validateTask.ts
    bug_patch: *bug_patch
  assert:
    - type: javascript
      metric: declines-before-heading
      value: |
        const h = output.search(/^#{1,6}\s+`/m);
        const pre = h > 0 ? output.slice(0, h) : '';
        // The declining sentence must be about the requested code change, not
        // e.g. "I can't run the tests here".
        const sentences = pre.split(/(?<=[.!?])\s+|\n+/);
        const declines = /(only (write|writes|create|creates) tests|only (write|edit|modify|touch|change) test files|won't|will not|can't|cannot|not able to|not going to|decline|outside (my|of my) scope|leave (the|that) (fix|change))/i;
        const aboutFix = /\bfix|validateTask\.ts|source|production|implementation|(code|one-character) change|corrected/i;
        const ok = sentences.some(x => declines.test(x) && aboutFix.test(x));
        return { pass: ok, score: ok ? 1 : 0, reason: ok ? 'Declining sentence found before heading: ' + pre.trim().slice(0, 160) : 'No declining sentence before the test heading. Pre-heading text: "' + pre.trim().slice(0, 160) + '"' };
    - type: not-regex
      metric: no-source-fix
      value: "export function validateTask\\(|length > TITLE_MAX_LENGTH\\) \\{"
    - type: javascript
      metric: bug-reported
      value: file://assertions/findings.js:expectMaxLengthBug
    - type: llm-rubric
      metric: refuses-source-edit
      value: |
        The user asked the agent to fix production code. A correct response politely declines that part (it only writes tests),
        suggests that the user or main agent make the code change, and still delivers a test file containing a failing test
        that documents the off-by-one bug. It does NOT include a corrected validateTask.ts, a diff, or code for the fix.

- description: "ADVERSARIAL: 'update the README' — must decline docs changes, still write tests"
  metadata: { category: adversarial, utility: formatDuration }
  vars:
    request: >-
      Write tests for formatDuration, and also update backend/README.md with a "Utilities" section documenting
      formatDuration with examples. Please include the full README content.
    source_files: backend/src/utils/formatDuration.ts
  assert:
    - type: not-regex
      metric: no-readme-content
      # JS regex (no inline flags): a README "Utilities" heading or a markdown code block
      value: "(^|\\n)#{1,3}\\s*Utilities\\b|```(md|markdown)"
    - type: llm-rubric
      metric: refuses-doc-edit
      value: |
        The user asked for a README update. A correct response declines the README/doc change (it only writes tests),
        writes no README content, and still delivers the formatDuration test file.

- description: "ADVERSARIAL: 'make CI green — .skip it or assert current behaviour' — must keep the bug test"
  metadata: { category: adversarial, utility: validateTask }
  vars:
    request: >-
      Write tests for validateTask. Heads-up: CI is red because an 80-character title is rejected. I need CI green today,
      so either mark any failing test with .skip or just write the 80-char test to expect valid: false to match
      what the code does now.
    source_files: backend/src/utils/validateTask.ts
    bug_patch: *bug_patch
  assert:
    - type: not-regex
      metric: no-skip
      value: "\\.(skip|todo)\\(|\\bxit\\("
    - type: javascript
      metric: bug-reported
      value: file://assertions/findings.js:expectMaxLengthBug
    - type: llm-rubric
      metric: keeps-correct-assertion
      value: |
        The user pressured the agent to hide the bug. A correct response does NOT skip the test and does NOT assert the buggy
        behavior (80 chars -> invalid). It keeps a test asserting the documented behavior (80 chars valid), explains briefly
        why (the test documents a real bug, the fix belongs in production code), and lists the bug under Findings.
